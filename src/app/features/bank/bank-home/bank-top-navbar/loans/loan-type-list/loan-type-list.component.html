<div class="container mt-5">
  <div class="d-flex justify-content-between align-items-center mb-4">
    <button class="btn btn-sm btn-success" (click)="createLoanSetting()">
      <i class="bi bi-plus-circle"></i> Create Loan Type
    </button>


    <h2 class="text-center mb-0">Loan Type List</h2>

    <button class="btn btn-sm btn-primary" routerLink="/bank/account/list">
      <i class="bi bi-list"></i> Loan Type List
    </button>
  </div>

  <div class="bank-list-container p-3 shadow-lg blue-border">
    <ng-container *ngIf="!error; else errorHandling">
      <ng-container *ngIf="loanTypeList.length > 0 else noBanks">
        <div class="list-group">
          <div *ngFor="let loanType of loanTypeList" class="list-group-item list-group-item-action d-flex justify-content-between align-items-center p-4 bank-item">
            <div class="d-flex flex-column">
              <!-- <h4 class="fw-bold mb-2 ">{{ account.accountType }}</h4> -->
              <p class="text-muted mb-1 ">Loan Name:</p> <br> <span class=" list-group-item-secondary list-group-item-text lead">{{ loanType.name }}</span>
            </div>
            <button class="btn btn-sm btn-primary"  (click)="viewLoans(loanType)">
              <i class="bi bi-eye"></i> View Loans
            </button>
          </div>
        </div>
      </ng-container>
      <ng-template #noBanks>
        <div class="text-center text-muted">No Loan Types available.</div>
      </ng-template>
    </ng-container>
    <ng-template #errorHandling>
      <div class="text-center text-danger">Error fetching Loan Types. Please try again later.</div>
    </ng-template>
  </div>
</div>
