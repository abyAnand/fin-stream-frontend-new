<div class="container mt-5">
  <div class="d-flex justify-content-between align-items-center mb-4">
    <button class="btn btn-sm btn-success" (click)="createLoanSetting()">
      <i class="bi bi-plus-circle"></i> Create Loan Type
    </button>
    <h2 class="text-center mb-0">Loan Type List</h2>
    <button class="btn btn-sm btn-primary" routerLink="/bank/account/list">
      <i class="bi bi-list"></i> Loan Type List
    </button>
  </div>

  <div class="bank-list-container p-3 shadow-lg blue-border">
    <ng-container *ngIf="!(error$ | async); else errorHandling">
      <ng-container *ngIf="(loanTypeList$ | async)?.length > 0; else noBanks">
        <div class="row row-cols-1 row-cols-md-3 g-4">
          <div *ngFor="let loanType of (loanTypeList$ | async)" class="col">
            <div class="card">
              <img class="card-img-top card-img-fixed" [src]="loanType.image ? loanType.image.imageUrl : getImage(loanType.loanCategory)" alt="Loan Type Image">
              <div class="card-body">
                <h3 class="card-title"> {{ loanType.loanCategory}}</h3>
                <h2 class="card-title">{{ loanType.name }}</h2>
                <div class="d-flex justify-content-between">
                  <button class="btn btn-sm btn-primary" (click)="viewLoans(loanType)">
                    <i class="bi bi-eye"></i> View Loans
                  </button>
                  <button class="btn btn-sm btn-secondary" (click)="setPhoto(loanType)">
                    <i class="bi bi-eye"></i> Set Photo
                  </button>
                </div>
              </div>
            </div>
          </div>
        </div>
      </ng-container>
      <ng-template #noBanks>
        <div class="text-center text-muted">No Loan Types available.</div>
      </ng-template>
    </ng-container>
    <ng-template #errorHandling>
      <div class="text-center text-danger">{{ error$ | async }}</div>
    </ng-template>
  </div>
</div>
