<div class="container mt-5">
  <div class="d-flex justify-content-between align-items-center mb-4">
    <h2 class="text-center mb-0">Loan Applications</h2>
  </div>

  <div class="bank-list-container p-3 shadow-lg blue-border">
    <ng-container *ngIf="!error; else errorHandling">
      <ng-container *ngIf="pendingLoanList.length > 0 else noBanks">
        <div class="list-group">
          <div *ngFor="let pendingLoan of pendingLoanList" class="list-group-item list-group-item-action d-flex justify-content-between align-items-center p-4 bank-item">
            <div class="d-flex flex-column">
              <!-- <h4 class="fw-bold mb-2 ">{{ account.accountType }}</h4> -->
              <p class="text-muted mb-1 ">Loan Name:</p> <br> <span class=" list-group-item-secondary list-group-item-text lead">{{ pendingLoan.loanName }}</span>
            </div>
            <button class="btn btn-sm btn-primary"  (click)="viewLoan(pendingLoan)">
              <i class="bi bi-eye"></i> View Loans
            </button>
          </div>
        </div>
      </ng-container>
      <ng-template #noBanks>
        <div class="text-center text-muted">No Loan Applications available.</div>
      </ng-template>
    </ng-container>
    <ng-template #errorHandling>
      <div class="text-center text-danger">Error fetching Loan Loan Applications. Please try again later.</div>
    </ng-template>
  </div>
</div>
