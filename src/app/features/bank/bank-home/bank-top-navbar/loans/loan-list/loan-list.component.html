<div class="container mt-5 d-flex flex-column align-items-center">
  <div class="d-flex justify-content-between align-items-center mb-4 w-100">
    <button class="btn btn-sm btn-success" (click)="createLoanSetting()">
      <i class="bi bi-plus-circle"></i> Create Loan
    </button>

    <h2 class="text-center mb-0">Loan List</h2>

    <button class="btn btn-sm btn-primary" routerLink="/bank/loan/type/list">
      <i class="bi bi-list"></i> Loan Type List
    </button>
  </div>

  <div class="container  rounded-4 shadow blue-border">
    <ng-container *ngIf="!error; else errorHandling">
      <ng-container *ngIf="loanSettingList.length > 0 else noBanks">
        <div *ngFor="let loanSetting of loanSettingList" class="row">
          <div class="col ">
            <div class="card mb-4">
              <h5 class="card-header">{{ loanSetting.name }}</h5>
              <div class="card-body">
                <h3 class="card-title">Interest Rate: {{ loanSetting.interestRate }}</h3>
                <h3 class="card-text">Loan Amount: {{ loanSetting.loanAmount }}</h3>
                <h3 class="card-text">Years: {{ loanSetting.loanTermMonths/12}}</h3>
                <button class="btn btn-sm btn-info mt-3" (click)="updateLoanSetting(loanSetting)">
                  <i class="bi bi-pencil"></i> Edit Loan Setting
                </button>
              </div>
            </div>
          </div>
        </div>
      </ng-container>
      <ng-template #noBanks>
        <div class="text-center text-muted">No Loans available.</div>
      </ng-template>
    </ng-container>
    <ng-template #errorHandling>
      <div class="text-center text-danger">Error fetching Loans. Please try again later.</div>
    </ng-template>
  </div>
</div>
