<ng-container *ngIf="shortName === 'SAVINGS'">
  <div class="container mt-5 mb-5">
    <div class="row justify-content-center">
      <div class="col-md-10 border rounded p-4 shadow">
        <h2 class="text-center mb-4">{{ shortName }} Account Settings</h2>

        <form [formGroup]="savingsAccountForm" class="mb-3">
          <div class="mb-3">
            <label for="accountName" class="form-label">Account Name</label>
            <input type="text" formControlName="accountName" class="form-control" id="accountName" required>
            <div *ngIf="isInvalid('accountName')" class="text-danger mt-2">
              Please enter an account name.
            </div>
          </div>

          <div class="mb-3">
            <label for="interestRate" class="form-label">Interest Rate</label>
            <input type="number" formControlName="interestRate" class="form-control" id="interestRate" required>
            <div *ngIf="isInvalid('interestRate')" class="text-danger mt-2">
              Please enter a valid interest rate.
            </div>
          </div>

          <div class="d-grid">

            <button (click)="createSavingsAccount()" [disabled]="!savingsAccountForm.valid" type="submit" class="btn btn-primary">Create Account</button>
          </div>
        </form>
      </div>
    </div>
  </div>
</ng-container>
