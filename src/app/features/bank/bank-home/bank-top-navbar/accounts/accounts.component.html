
<div class="container mt-4">
  <div class="d-flex justify-content-between align-items-center mb-3">
    <button class="btn btn-success me-2">
      <i class="bi bi-plus"></i> Create
    </button>
    <button class="btn btn-primary">
      <i class="bi bi-arrow-left"></i> Go Back
    </button>
  </div>

  <div *ngIf="accountList.length > 0; else noAccounts">
    <ul class="list-group">
      <li *ngFor="let account of accountList" class="list-group-item d-flex justify-content-between align-items-center">
        {{ account.accountName }}
        <button class="btn btn-secondary">Edit</button>
      </li>
    </ul>
  </div>

  <ng-template #noAccounts>
    <div class="alert alert-info">No accounts available.</div>
  </ng-template>

  <ng-template #errorHandling>
    <div class="alert alert-danger">Error fetching accounts. Please try again later.</div>
  </ng-template>
</div>
