<div class="container mt-5">
  <div class="d-flex justify-content-between align-items-center mb-4">
    <button class="btn btn-sm btn-success" (click)="createAccount()">
      <i class="bi bi-plus-circle"></i> Create Account
    </button>

    <h2 class="text-center mb-0">List of Accounts - {{ shortName }}</h2>

    <button class="btn btn-sm btn-primary" routerLink="/bank/account/list">
      <i class="bi bi-list"></i> Account List
    </button>
  </div>

  <div class="bank-list-container p-3 shadow-lg blue-border">
    <ng-container *ngIf="error$; else errorHandling">
      <ng-container *ngIf="(accountSettingList$ | async) else noBanks">
        <div class="row row-cols-1 row-cols-md-3 g-4">
          <div *ngFor="let account of accountSettingList$ | async" class="col">
            <div class="card">
              <img
                class="card-img-top card-img-fixed"
                [src]="account.image?.imageUrl || '/assets/login_bg1.jpg'"
                alt="Account Image">
              <div class="card-body">
                <h2 class="card-title">{{ account.accountName }}</h2>
                <p class="card-text">ACCOUNT TYPE: {{ account.accountType }}</p>
                <div class="d-flex justify-content-between">
                  <button class="btn btn-sm btn-primary" (click)="viewAccounts(account)">
                    <i class="bi bi-eye"></i> Edit Account Setting
                  </button>
                  <button class="btn btn-sm btn-secondary" (click)="setPhoto(account)">
                    <i class="bi bi-eye"></i> Set Photo
                  </button>
                </div>
              </div>
            </div>
          </div>
        </div>
      </ng-container>
      <ng-template #noBanks>
        <div class="text-center text-muted">No {{shortName}} Account Settings available.</div>
      </ng-template>
    </ng-container>
    <ng-template #errorHandling>
      <div class="text-center text-danger">Error fetching Account Types. Please try again later.</div>
    </ng-template>
  </div>
</div>
