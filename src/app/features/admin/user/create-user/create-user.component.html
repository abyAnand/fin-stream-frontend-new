<!-- create-user.component.html -->
<div class="container mt-5">
  <div class="row justify-content-center">
    <div class="col-md-6 border border-info p-4">
      <h2 class="text-center">Create User</h2>
      <form [formGroup]="createUserForm" (ngSubmit)="createUser()">
        <div class="mb-3">
          <label for="firstName" class="form-label">First Name</label>
          <input type="text" formControlName="firstName" class="form-control" id="firstName">
          <div *ngIf="createUserForm.get('firstName')?.touched && createUserForm.get('firstName')?.invalid" class="text-danger">
            First Name is required.
          </div>
        </div>
        <div class="mb-3">
          <label for="lastName" class="form-label">Last Name</label>
          <input type="text" formControlName="lastName" class="form-control" id="lastName">
          <div *ngIf="createUserForm.get('lastName')?.touched && createUserForm.get('lastName')?.invalid" class="text-danger">
            Last Name is required.
          </div>
        </div>
        <div class="mb-3">
          <label for="email" class="form-label">Email address</label>
          <input type="email" formControlName="email" class="form-control" id="email">
          <div *ngIf="createUserForm.get('email')?.touched && createUserForm.get('email')?.invalid" class="text-danger">
            Please enter a valid email.
          </div>
        </div>

        <div class="mb-3">
          <label for="role" class="form-label">Role</label>
          <select formControlName="role" class="form-select" id="role">
            <option [value]="role" *ngFor="let role of roles">{{ role }}</option>
          </select>
          <div *ngIf="createUserForm.get('role')?.touched && createUserForm.get('role')?.invalid" class="text-danger">
            Role is required.
          </div>
        </div>

        <div class="mb-3">
          <label for="password" class="form-label">Password</label>
          <input type="password" formControlName="password" class="form-control" id="password">
          <div *ngIf="createUserForm.get('password')?.hasError('minlength') && createUserForm.get('password')?.touched" class="text-danger">
            Password must be at least 5 characters long.
          </div>
        </div>
        <div class="mb-3">
          <label for="confirmPassword" class="form-label">Confirm Password</label>
          <input type="password" formControlName="confirmPassword" class="form-control" id="confirmPassword">
          <div *ngIf="createUserForm.get('confirmPassword')?.hasError('mismatch') && createUserForm.get('confirmPassword')?.touched" class="text-danger">
            Passwords do not match.
          </div>
        </div>
        <div class="mb-3">
          <label for="phoneNumber" class="form-label">Phone Number</label>
          <input type="tel" formControlName="phoneNumber" class="form-control" id="phoneNumber">
          <div *ngIf="createUserForm.get('phoneNumber')?.touched && createUserForm.get('phoneNumber')?.invalid" class="text-danger">
            Please enter a valid phone number.
          </div>
        </div>
        <button type="submit" [disabled]="!createUserForm.valid" class="btn btn-info ">Create User</button>
      </form>
    </div>
  </div>
</div>
