<app-top-navbar></app-top-navbar>
<div class="row">
  <div class="col-md-6">
    <div class="chart-container">
      <canvas id="bankAccountsChart"></canvas>
    </div>
    <div>
      <h4> Banks</h4>
      <ul class="list-group">
        <li class="list-group-item list-group-item-sm" *ngFor="let bank of banks">{{ bank.name }}</li>
      </ul>
    </div>
  </div>
  <div class="col-md-6">
    <div class="chart-container">
      <canvas id="userRegistrationsChart"></canvas>
    </div>
    <div>
      <h4> Users</h4>
      <ul class="list-group">
        <li class="list-group-item list-group-item-sm" *ngFor="let user of users">{{ user.firstName }} {{ user.lastName }}</li>
      </ul>
    </div>
  </div>
</div>
