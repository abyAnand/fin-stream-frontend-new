<app-top-navbar></app-top-navbar>
<div class="container">
    <div class="row justify-content-center mt-4">
        <div class="col-md-12">
            <div class="card table-nowrap table-card">
                <div class="card-header d-flex justify-content-between align-items-center bg-primary text-white">
                    <h3 class="m-0">Bank Information</h3>
                    <button class="btn btn-sm btn-success" (click)="createBank()">
                        <i class="fa fa-bank me-1"></i> Create Bank
                    </button>
                </div>
                <div class="card-body">
                    <div class="table-responsive">
                        <table class="table mb-0">
                            <thead class="small text-uppercase bg-body text-muted">
                                <tr>
                                    <th>#</th>
                                    <th>Bank Name</th>
                                    <th>Email</th>
                                    <th>Verified</th>
                                    <th>Number of Account Settings</th>
                                    <th>Number of Loan Settings</th>
                                    <th class="text-end">Action</th>
                                </tr>
                            </thead>
                            <tbody *ngIf="banks && banks.length > 0; else noBanks">
                                <tr class="align-middle" *ngFor="let bank of banks; let i = index">
                                    <td>{{ i + 1 }}</td>
                                    <td>{{ bank.name }}</td>
                                    <td>{{ bank.email }}</td>
                                    <td [style.color]="bank.verified ? 'green' : 'red'">{{ bank.verified ? 'Yes' : 'No' }}</td>
                                    <td>{{ bank.accountSettingDtoList.length }}</td>
                                    <td>{{ bank.loanSettingDtoList.length }}</td>
                                    <td class="text-end">
                                        <div class="btn-group" role="group" aria-label="Bank Actions">
                                            <button *ngIf="bank.verified" class="btn btn-sm btn-primary" (click)="viewDetails(bank)">
                                                <i class="fa fa-eye"></i>
                                            </button>
                                            <button *ngIf="!bank.verified" class="btn btn-sm btn-success" (click)="verifyBank(bank)">
                                                <i class="fa fa-check"></i>
                                            </button>
                                            <!-- <button class="btn btn-sm btn-info" (click)="editBank(bank)">
                                                <i class="fa fa-edit"></i>
                                            </button> -->
                                            <button class="btn btn-sm btn-danger" (click)="deleteBank(bank)">
                                                <i class="fa fa-trash"></i>
                                            </button>
                                            <button class="btn btn-sm btn-warning" (click)="blockBank(bank)">
                                                <i class="fa fa-ban"></i>
                                            </button>
                                        </div>
                                    </td>
                                </tr>
                            </tbody>
                            <ng-template #noBanks>
                                <tr>
                                    <td colspan="7">No bank data available.</td>
                                </tr>
                            </ng-template>
                        </table>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
