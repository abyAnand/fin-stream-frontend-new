<div class="container mt-5">
  <div class="row justify-content-center">
    <!-- Centered Register Form -->
    <div class="col-md-6 border border-warning p-4">
      <h2 class="text-center">Register</h2>
      <form [formGroup]="signupForm" (ngSubmit)="signUp()">
        <div class="mb-3">
          <label for="firstName" class="form-label">First Name</label>
          <input type="text" formControlName="firstName" class="form-control" id="firstName" required>
          <div *ngIf="signupForm.get('firstName')?.touched && signupForm.get('firstName')?.invalid" class="text-danger">
            Please enter a valid first name.
         </div>
        </div>
        <div class="mb-3">
          <label for="lastName" class="form-label">Last Name</label>
          <input type="text" formControlName="lastName" class="form-control" id="lastName" required>
          <div *ngIf="signupForm.get('lastName')?.touched && signupForm.get('lastName')?.invalid" class="text-danger">
            Please enter a valid last name.
         </div>
        </div>
        <div class="mb-3">
          <label for="registerEmail" class="form-label">Email address</label>
          <input type="email" formControlName="email" class="form-control" id="registerEmail" aria-describedby="emailHelp" required>
          <div *ngIf="signupForm.get('email')?.touched && signupForm.get('email')?.invalid" class="text-danger">
            Please enter a valid email.
         </div>
        </div>
        <div class="mb-3">
          <label for="registerPassword" class="form-label">Password</label>
          <input type="password" formControlName="password" class="form-control" id="registerPassword" required>
          <div *ngIf="signupForm.get('password')?.hasError('minlength') && signupForm.get('password')?.touched" class="text-danger">
            Password must be at least 5 characters long.
          </div>
        </div>
        <div class="mb-3">
          <label for="confirmPassword" class="form-label">Confirm Password</label>
          <input type="password" formControlName="confirmPassword" class="form-control" id="confirmPassword" required>
          <div *ngIf="signupForm.get('confirmPassword')?.hasError('mismatch') && signupForm.get('confirmPassword')?.touched" class="text-danger">
            Passwords do not match.
          </div>
        </div>
        <div class="mb-3">
          <label for="phoneNumber" class="form-label">Phone Number</label>
          <input type="tel" formControlName="phoneNumber" class="form-control" id="phoneNumber" required>
          <div *ngIf="signupForm.get('phoneNumber')?.touched && signupForm.get('phoneNumber')?.invalid" class="text-danger">
            Please enter a valid phone number.
         </div>
        </div>
        <button type="submit" [disabled]="!signupForm.valid" class="btn btn-warning">Register</button>

        <div class="mb-3 text-center">
          <a routerLink="/login" class="text-decoration-none">Sign In</a>
        </div>
      </form>
    </div>
  </div>
</div>
