<div class="container mt-5">
  <h2 class="text-center mb-4 sticky-top bg-white">Bank Accounts</h2>
  <div *ngIf="!error; else errorHandling" class="bank-list-container border rounded p-3 shadow-lg orange-border">
    <ng-container *ngIf="accountList.length > 0; else noAccounts">
      <div class="row row-cols-1 row-cols-md-3 g-4">
        <div *ngFor="let account of accountList" class="col">
          <div class="card">
            <img class="card-img-top card-img-fixed" [src]="getImage(account.accountType)" alt="Account Image">
            <div class="card-body">
              <h5 class="card-title">{{ account.accountName }}</h5>
              <p class="card-text">Account Type: {{ account.accountType }}</p>
              <a [routerLink]="['/dashboard/create/', account.accountType]" (click)="showAccountDetails(account)" class="btn btn-primary btn-sm">Show Details</a>
            </div>
          </div>
        </div>
      </div>
    </ng-container>
    <ng-template #noAccounts>
      <div class="text-center text-muted">No accounts available for this bank.</div>
    </ng-template>
  </div>
  <ng-template #errorHandling>
    <div class="text-center text-danger">Error fetching accounts. Please try again later.</div>
  </ng-template>
</div>
