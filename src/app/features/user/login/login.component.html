<div class="container">
  <div class="row justify-content-center">
    <div class="col-12 col-md-8 col-lg-6 border border-warning p-4 bg-light rounded shadow custom-form-width">
      <h2 class="text-center mb-4 text-warning">Login</h2>
      <form [formGroup]="loginForm">
        <div class="mb-3">
          <label for="loginEmail" class="form-label">Email address</label>
          <input type="email" formControlName="email" class="form-control" id="loginEmail" required>
          <div *ngIf="loginForm.get('email')?.touched && loginForm.get('email')?.invalid" class="text-danger">
            Please enter a valid email.
          </div>
        </div>
        <div class="mb-3">
          <label for="loginPassword" class="form-label">Password</label>
          <input type="password" formControlName="password" class="form-control" id="loginPassword" required>
          <div *ngIf="loginForm.get('password')?.touched && loginForm.get('password')?.invalid" class="text-danger">
            Please enter Password.
          </div>

          <div class="d-flex flex-row justify-content-between mt-2">
            <div class="mb-3 text-center">
              <a routerLink="/auth/forgot-password" class="text-decoration-none text-warning">Forgot Password?</a>
            </div>
            <div class="mt-1 text-center">
              <a routerLink="/register" class="text-decoration-none text-warning">Open an Account</a>
            </div>
          </div>
        </div>

        <div class="mb-3 text-center">
          <a routerLink="/auth/bank/login" class="text-decoration-none text-warning">Login as Bank</a>
        </div>
        <div class="mb-3 text-center">
          <a routerLink="/auth/admin/login" class="text-decoration-none text-warning">Login as Admin</a>
        </div>
        <div class="d-grid">
          <button (click)="login()" [disabled]="!loginForm.valid" type="submit" class="btn btn-warning">Login</button>
        </div>
      </form>
    </div>
  </div>
</div>
