<div class="container-lg my-3">
  <h2 class="text-center mb-4">Update User Password</h2>
  <form class="row g-3" [formGroup]="changePassword">
<div class="col-md-4">
  <label for="password" class="form-label">Password</label>
  <div class="input-group">
    <input #passwordInput type="{{ showPassword ? 'text' : 'password' }}" formControlName="password" [readonly]="!isEditMode"
      class="form-control" id="password" placeholder="Enter Password" />
    <span class="input-group-text" (click)="togglePasswordVisibility()">
      <i class="{{ showPassword ? 'bi bi-eye-slash' : 'bi bi-eye' }}"></i>
    </span>
  </div>
</div>
<div class="col-md-4">
  <label for="confirmPassword" class="form-label">Confirm Password</label>
  <input type="password" [readonly]="!isEditMode" class="form-control" id="confirmPassword"
    placeholder="Confirm Password">
</div>
<div class="col-12">
  <button type="button" class="btn btn-update-user btn-outline-warning" (click)="toggleEditMode()">
    {{ isEditMode ? 'Save Changes' : 'Edit' }}
  </button>
</div>
</form>
</div>
