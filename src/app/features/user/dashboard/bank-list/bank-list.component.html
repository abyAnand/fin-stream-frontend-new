<app-navbar></app-navbar>
<div class="container mt-5">
  <h2 class="text-center mb-4 sticky-top bg-white">List of Banks</h2>
  <div class="bank-list-container p-3 shadow-lg orange-border">
    <ng-container *ngIf="!error; else errorHandling">
      <ng-container *ngIf="(bankList$ | async).length > 0; else noBanks">
        <div class="row row-cols-1 row-cols-md-3 g-4">
          <div *ngFor="let bank of (bankList$ | async)" class="col">
            <div class="card">
              <img
                class="card-img-top card-img-fixed"
                [src]="bank?.image?.imageUrl || '/assets/bank_profile.jpeg'"
                alt="Bank Image">
              <div class="card-body">
                <h2 class="card-title">{{ bank.name }}</h2>
                <p class="card-text">{{ bank.shortName | uppercase }}</p>
                <div class="d-flex justify-content-between">
                  <button class="btn btn-primary btn-sm" [routerLink]="['/dashboard/accounts/', bank.id]">
                    <i class="bi bi-eye"></i> Show Bank Accounts
                  </button>
                </div>
              </div>
            </div>
          </div>
        </div>
      </ng-container>
      <ng-template #noBanks>
        <div class="text-center text-muted">No banks available.</div>
      </ng-template>
    </ng-container>
    <ng-template #errorHandling>
      <div class="text-center text-danger">Error fetching banks. Please try again later.</div>
    </ng-template>
  </div>
</div>
