<div class="container-lg my-3">
  <h2 class="text-center mb-4">Update User</h2>
  <form class="row g-3 border rounded p-4" [formGroup]="updateForm" style="box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);">
    <!-- Personal Information Section -->
    <div class="col-md-12 mb-3">
      <h3 class="border-bottom pb-2 display-5 fw-bold">Personal Information</h3>
      <div class="row g-3">
        <div class="col-md-6">
          <label for="firstName" class="form-label">First Name</label>
          <input type="text" formControlName="firstName" class="form-control" [readonly]="!isEditMode" id="firstName" placeholder="Enter First Name">
        </div>
        <div class="col-md-6">
          <label for="lastName" class="form-label">Last Name</label>
          <input type="text" formControlName="lastName" class="form-control" [readonly]="!isEditMode" id="lastName" placeholder="Enter Last Name">
        </div>
      </div>
    </div>
    <!-- End of Personal Information Section -->

    <!-- Employment Information Section -->
    <div class="col-md-12 mb-3">
      <h3 class="border-bottom pb-2 display-5 fw-bold">Employment Information</h3>
      <div class="row g-3">
        <div class="col-md-4">
          <label for="employmentStatus" class="form-label">Employment Status</label>
      
          <ng-container *ngIf="!isEditMode">
            <input type="text" formControlName="employmentStatus" class="form-control" id="employmentStatus" readonly>
          </ng-container>
     
          <ng-container *ngIf="isEditMode">
            <select formControlName="employmentStatus" class="form-select" id="employmentStatus">
              <option value="" disabled [selected]="!updateForm.get('employmentStatus').value">Select Employment Status</option>
              <option value="EMPLOYED">Employed</option>
              <option value="SELF_EMPLOYED">Self-Employed</option>
              <option value="UNEMPLOYED">Unemployed</option>
              <option value="STUDENT">Student</option>
              <option value="RETIRED">Retired</option>
              <option value="OTHER">Other</option>
            </select>
          </ng-container>
        </div>
        <div class="col-md-4">
          <label for="monthlyIncome" class="form-label">Monthly Income</label>
          <input type="number" formControlName="monthlyIncome" class="form-control" [readonly]="!isEditMode" id="monthlyIncome" placeholder="Enter Monthly Income">
        </div>
        <div class="col-md-4">
          <label for="totalAssets" class="form-label">Total Assets</label>
          <input type="number" formControlName="totalAssets" class="form-control" [readonly]="!isEditMode" id="totalAssets" placeholder="Enter Total Assets">
        </div>
        <div class="col-md-4">
          <label for="totalLiabilities" class="form-label">Total Liabilities</label>
          <input type="number" formControlName="totalLiabilities" class="form-control" [readonly]="!isEditMode" id="totalLiabilities" placeholder="Enter Total Liabilities">
        </div>
      </div>
    </div>
    <!-- End of Employment Information Section -->
