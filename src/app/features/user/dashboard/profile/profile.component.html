<div class="container-lg my-3">
  <h2 class="text-center mb-4">Update User</h2>
  <form class="row g-3" [formGroup]="updateForm">
    <div class="col-md-6">
      <label for="firstName" class="form-label">First Name</label>
      <input type="text" class="form-control" [readonly]="!isEditMode" id="firstName" placeholder="Enter First Name">
    </div>
    <div class="col-md-6">
      <label for="lastName" class="form-label">Last Name</label>
      <input type="text" class="form-control" [readonly]="!isEditMode" id="lastName" placeholder="Enter Last Name">
    </div>

    <div class="col-md-4">
      <label for="email" class="form-label">Email</label>
      <div class="input-group">
        <div class="input-group-text">@</div>
        <input type="email" [readonly]="!isEditMode" class="form-control" id="email" placeholder="Enter Email">
      </div>
    </div>
    <div class="col-md-4">
      <label for="password" class="form-label">Password</label>
      <div class="input-group">
        <input #passwordInput type="{{ showPassword ? 'text' : 'password' }}" [readonly]="!isEditMode"
          class="form-control" id="password" placeholder="Enter Password" />
        <span class="input-group-text" (click)="togglePasswordVisibility()">
          <i class="{{ showPassword ? 'bi bi-eye-slash' : 'bi bi-eye' }}"></i>
        </span>
      </div>
    </div>
    <div class="col-md-4">
      <label for="confirmPassword" class="form-label">Confirm Password</label>
      <input type="password" [readonly]="!isEditMode" class="form-control" id="confirmPassword"
        placeholder="Confirm Password">
    </div>
    <div class="col-12">
      <label for="inputAddress" class="form-label">Address</label>
      <input type="text" [readonly]="!isEditMode" class="form-control" id="inputAddress" placeholder="1234 Main St">
    </div>
    <div class="col-12">
      <label for="inputAddress2" class="form-label">Address 2</label>
      <input type="text" [readonly]="!isEditMode" class="form-control" id="inputAddress2"
        placeholder="Apartment, studio, or floor">
    </div>
    <div class="col-md-6">
      <label for="inputCity" class="form-label">City</label>
      <input type="text" [readonly]="!isEditMode" class="form-control" id="inputCity">
    </div>

    <div class="col-md-2">
      <label for="inputZip" class="form-label">Zip</label>
      <input type="text" [readonly]="!isEditMode" class="form-control" id="inputZip">
    </div>

    <div class="col-12">
      <button type="button" class="btn btn-update-user btn-outline-warning" (click)="toggleEditMode()">
        {{ isEditMode ? 'Save Changes' : 'Edit' }}
      </button>
    </div>
  </form>
</div>
