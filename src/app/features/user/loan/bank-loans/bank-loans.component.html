<div class="container mt-5">
  <div class="d-flex justify-content-center align-items-center mb-4">
    <div class="text-center">
      <h2 class="heading-title mb-2">List of Bank Loans</h2>
      <p class="heading-subtitle text-muted">Find the best loan options available for you</p>
    </div>
  </div>

  <div class="row">
    <ng-container *ngIf="!error; else errorHandling">
      <ng-container *ngIf="bankLoanList else noBanks">
        <div *ngFor="let bankLoan of bankLoanList" class="col-md-4 mb-4">
          <div class="card">
            <img [src]="bankLoan.image ? bankLoan.image.imageUrl : getImage(bankLoan.loanCategory)" class="card-img-top" alt="Loan Type Image">
            <div class="card-body">
              <h5 class="card-title">{{ bankLoan.name }}</h5>
              <p class="card-text">Loan Category: {{ bankLoan.loanCategory }}</p>
              <button class="btn btn-sm btn-custom" [ngStyle]="{ 'background-color': getButtonColor(bankLoan.id),'color': getStatusColor(bankLoan.id) }" (click)="viewLoanPlans(bankLoan)">
                {{ getStatus(bankLoan.id) }}
              </button>
            </div>
          </div>
        </div>
      </ng-container>
      <ng-template #noBanks>
        <div class="text-center text-muted">No Bank Loans available.</div>
      </ng-template>
    </ng-container>
    <ng-template #errorHandling>
      <div class="text-center text-danger">Error Fetching Bank Loans. Please try again later.</div>
    </ng-template>
  </div>
</div>
