<div class="container mt-5">
  <div class="row justify-content-center">
    <div class="col-md-6">
      <div class="card">
        <div class="card-header">
          <h3>Deposit to Account</h3>
        </div>
        <div class="card-body">
          <form [formGroup]="depositForm">
            <div class="mb-3">
              <label for="depositAmount" class="form-label">Deposit Amount</label>
              <input type="number" class="form-control" id="depositAmount" formControlName="depositAmount" placeholder="Enter amount">
            </div>
            <div class="text-center">
              <button type="submit" class="btn btn-success me-2" (click)="deposit()" [disabled]="depositForm.invalid">Deposit</button>
              <button type="button" class="btn btn-secondary" (click)="cancel()">Cancel</button>
            </div>
          </form>
        </div>
      </div>
    </div>
  </div>
</div>
