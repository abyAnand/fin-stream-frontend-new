<div class="container mt-5">
  <div class="row justify-content-center">
    <div class="col-md-6">
      <div class="card">
        <div class="card-header">
          <h3>Transfer to Account</h3>
        </div>
        <div class="card-body">
          <form [formGroup]="transferForm">
            <div class="mb-3">
              <label for="accountNumber" class="form-label">Account Number</label>
              <input type="string" class="form-control" id="accountNumber" formControlName="accountNumber" placeholder="Enter Account Number">
            </div>
            <div class="mb-3">
              <label for="depositAmount" class="form-label">Deposit Amount</label>
              <input type="number" class="form-control" id="depositAmount" formControlName="depositAmount" placeholder="Enter amount">
            </div>
            <div class="text-center">
              <button type="submit" class="btn btn-success me-2" (click)="transfer()" [disabled]="transferForm.invalid">Deposit</button>
              <button type="button" class="btn btn-secondary" (click)="cancel()">Cancel</button>
            </div>
          </form>
        </div>
      </div>
    </div>
  </div>
</div>
