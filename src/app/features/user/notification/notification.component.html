<app-navbar></app-navbar>

<div class="container mt-5">
  <div class="title text-center">
    <h3>Notifications</h3>
  </div>
</div>

<div class="container mt-3">
  <ng-container *ngIf="notifications.length > 0; else noNotificationsTemplate">
    <div *ngFor="let notification of notifications" class="notification-card mb-4">
      <div class="card shadow-lg border-0">
        <div class="card-header d-flex justify-content-between align-items-center" [ngClass]="getAlertClass(notification)">
          <div class="d-flex align-items-center">
            <i class="material-icons icon mr-3">{{ getIcon(notification.event) }}</i>
            <span class="event">{{ getEventTitle(notification.event) }}</span>
          </div>
          <button type="button" class="close" aria-label="Close" (click)="dismissNotification(notification)">
            <span aria-hidden="true">&times;</span>
          </button>
        </div>
        <div class="card-body">
          <p class="card-text">{{ notification.message }}</p>
        </div>
      </div>
    </div>
  </ng-container>
  <ng-template #noNotificationsTemplate>
    <div class="alert alert-info text-center" role="alert">
      No new notifications.
    </div>
  </ng-template>
</div>
