<div class="container mt-5">
  <div class="row justify-content-center">
    <div class="col-md-6 border border-primary p-4">
      <h2 class="text-center mb-4">Forgot Password</h2>
      <form [formGroup]="forgotPasswordForm">
        <div class="mb-3">
          <label for="forgotPasswordEmail" class="form-label">Enter your email address</label>
          <input type="email" formControlName="email" class="form-control" id="forgotPasswordEmail" required>
        </div>
        <div *ngIf="emailNotFoundError" class="text-danger mb-3">Email not found. Please enter a valid email address.</div>
        <div class="d-grid">
          <button (click)="verifyUser()" [disabled]="!forgotPasswordForm.get('email').valid" class="btn btn-primary">Verify User</button>
        </div>
      </form>
      <div *ngIf="verificationSent" class="mt-3">
        <p>An OTP has been sent to your email address. Please check your inbox.</p>
        <form [formGroup]="otpForm">
          <div class="mb-3">
            <label for="otp" class="form-label">Enter OTP</label>
            <input type="number" formControlName="otp" class="form-control" id="otp" required>
          </div>
          <div class="d-grid">
            <button (click)="verifyOTP()" [disabled]="!otpForm.valid" class="btn btn-primary">Verify</button>
          </div>
        </form>
        <div *ngIf="wrongOTP" class="text-danger mt-3">Wrong OTP. Please try again.</div>
      </div>
      <div *ngIf="resetPassword" class="mt-3">
        <form [formGroup]="newPasswordForm">
          <div class="mb-3">
            <label for="newPassword" class="form-label">Enter New Password</label>
            <input type="password" formControlName="newPassword" class="form-control" id="newPassword" required>
          </div>
          <div class="d-grid">
            <button (click)="resetUserPassword()" [disabled]="!newPasswordForm.valid" class="btn btn-primary">Reset Password</button>
          </div>
        </form>
      </div>
    </div>
  </div>
</div>
