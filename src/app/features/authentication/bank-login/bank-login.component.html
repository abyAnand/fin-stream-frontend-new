<div class="background-container">
  <div class="container mt-5">
    <div class="row justify-content-center">
      <div class="col-md-6">
        <div class="card p-4 shadow">
          <div class="text-center mb-4">
            <h2 class="text-success">Bank Login</h2>
          </div>
          <form [formGroup]="loginForm">
            <div class="mb-3">
              <label for="loginEmail" class="form-label">Username or access Card</label>
              <input type="email" formControlName="email" class="form-control" id="loginEmail" required>
              <div *ngIf="loginForm.get('email')?.touched && loginForm.get('email')?.invalid" class="text-danger">
                Please enter a valid email.
              </div>
            </div>
            <div class="mb-3">
              <label for="loginPassword" class="form-label">Password</label>
              <input type="password" formControlName="password" class="form-control" id="loginPassword" required>
              <div *ngIf="loginForm.get('password')?.touched && loginForm.get('password')?.invalid" class="text-danger">
                Please enter Password.
              </div>
            </div>
            <div class="form-check mb-3">
              <input type="checkbox" class="form-check-input" id="rememberMe">
              <label class="form-check-label" for="rememberMe">Remember me</label>
            </div>
            <div class="d-grid">
              <button (click)="login()" [disabled]="!loginForm.valid" type="submit" class="btn btn-success">Login</button>
            </div>
            <div class="text-center mt-3">
              <a href="#" class="text-decoration-none">Forgot your username or password?</a>
            </div>
            <div class="text-center mt-2">
              <a routerLink="/auth/bank/register" class="text-decoration-none text-success">Register</a>
            </div>
          </form>
        </div>
      </div>
    </div>
  </div>
</div>
